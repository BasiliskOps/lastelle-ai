name: fetch-assets
on:
  push:
    branches: [redesign]
    paths: ['.github/workflows/fetch-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public-domain Vitruvian Man scan
        run: |
          UA="annatar-site-asset-fetch/1.0 (github.com/basiliskops/annatar-site)"
          curl -fsSL -A "$UA" -o assets/vitruvian.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Da_Vinci_Vitruve_Luc_Viatour.jpg?width=2400"
          file assets/vitruvian.jpg; ls -la assets
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/vitruvian.jpg
          git commit -m "Add Vitruvian Man scan (public domain, via Wikimedia Commons)" || echo nothing
          git push
